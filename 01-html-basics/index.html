<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button>botão</button>
    <h1>Com o a tag &ltH1&gt é criado um titulo grande</h1>
    <h2>Com a tag &ltH2&gt é criado um titulo médio</h2>
    <h3>Com a tag &ltH3&gt é criado um titulo pequeno (e assim por diante)</h3>
    <p>A tag &ltp&gt é usada para criar parágrafos</p>

    <a href="https://www.youtube.com/">usamos a tag &lta&gt para links, tudo dentro dela se torna um link</a>

    <div>
      <button>a tag &ltbutton&gt cria botões</button>
    </div>
    <div>
      <a href="https://www.youtube.com/">
        <button>botão para o youtube</button>
      </a>
    </div>
    
    <div>
      <a href="https://www.youtube.com/" target = "_blank">
        <button>um botão para o youtube que abre em outra página</button>
      </a>
    </div>
    <p>a tag &ltimg&gt é usada para anexar imagens</p>
    <img src="image.png" alt="">
    
</body>
</html>
