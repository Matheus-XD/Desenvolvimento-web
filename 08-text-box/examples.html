<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input{
            width: 300px;
            height: 30px;
        }
        span{
            color: blue;
        }

    </style>
</head>
<body>
    <h1>tag &ltinput&gt</h1>

    <p>
        usando a tag <span>&ltinput&gt</span> podemos criar caixas de texto de varios tipos, por exemplo:  <br>
        <span>type: text</span>
    </p>
    <input type="text" placeholder="digite seu texto aqui" >

    <p>
        <span>type: passowrd </span>
    </p>
    <input type="password">

    <p>
        <span>type: checkbox</span>
    </p>
    <input type="checkbox">
    
</body>
</html>
