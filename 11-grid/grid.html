<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid practice</title>
    <style>

        .display-1{
            display: grid;
            grid-template-columns: 200px 1fr;

        }
        .display-2{
            display: grid;
            grid-template-columns: 100px 1fr 100px;
        }
        .display-3{
            display: grid;
            grid-template-columns:  1fr 1fr 1fr;           
        }
    </style>
</head>
<body>

    <h1>display 1</h1>
    <div class="display-1">
        <div style="background-color: lightblue; height: 200px;">div 1</div>
        <div style="background-color: lightcoral; height: 200px;">div 2</div>
    </div>

    <h1>display 2</h1>
    <div class="display-2">
        <div style="background-color: lightblue; height: 200px;">div 1</div>
        <div style="background-color: lightcoral; height: 200px;">div 2</div>
        <div style="background-color: lightblue; height: 200px;">div 3</div>

    </div>

    <h1>display 3</h1>
    <div class=" display-3">
        <div style="background-color: lightblue; height: 200px;">div 1</div>
        <div style="background-color: lightcoral; height: 200px;">div 2</div>
        <div style="background-color: lightblue; height: 200px ">div 3</div>
        <div style="background-color: lightcoral; height: 200px">div 4</div>
        <div style="background-color: lightblue; height: 200px">div 5</div>
        <div style="background-color: lightcoral; height: 200px">div 6</div>
    </div>
</body>
</html>
