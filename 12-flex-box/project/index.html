<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="header.css">
    <title>Document</title>

</head>
<body>

    
    <div class="header">
        <div class="header-left-section">
            <img class="youtube-logo" src="images/header/youtube-logo.svg" alt="">
        </div>      
        <div class="header-middle-section">
            <input class="search-bar" type="text" placeholder="Search">
            <img class="search-button"  src="images/header/search.svg" alt="">
            <img class="voice-search-button"  src="images/header/voice-search-icon.svg" alt="">
        </div>
        <div class="header-right-section">
            <img class="header-upload" src="images/header/upload.svg" alt="">
            <img class="header-yt-apps" src="images/header/youtube-apps.svg" alt="">
            <img class="header-notifications" src="images/header/notifications.svg" alt="">
            <img class="header-profile-picture" src="images/profile-pictures/cat-photo.jpg" alt="">
        </div>     
    </div>

    
</body>
</html>
