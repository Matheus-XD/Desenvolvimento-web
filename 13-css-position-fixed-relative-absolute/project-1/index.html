<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            margin: 0;
        }
        p{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 18px;
        }
        .profiles-sidebar{
            background-color: rgb(29, 28, 28);
            display: flex;
            flex-direction: column;
            position: fixed;
            align-items: center;
            top: 0;
            left: 0;
            bottom: 0;
            width: 90px;
        }
        .profile-picture{
            margin-top: 20px;
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 30px;
        }
        .info{

            background-color: rgb(58, 56, 56);
            position: fixed;
            top: 0;
            bottom: 0;
            left: 90px;
            width: 200px;
            padding: 20px;
            

            
        }
        .title{
            color: white;
            font-weight: 600;
        }
        .option{
            margin-top: 20px;
            color: gray;
        }
        .plus-button{
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 20px;
            font-weight: 600;
            background-color: transparent;
            color:gray;
            border: none;

        }
    </style>
</head>
<body>
    <div class="profiles-sidebar">
        <img class="profile-picture" src="profile-pictures/cat-photo.jpg" alt="">
        <img class="profile-picture" src="profile-pictures/cat2-photo.jpg" alt="">
        <img class="profile-picture" src="profile-pictures/dog-image.jpg" alt="">
    </div>
    <div class="info">
        <P class="title">INFO</P>
        <p class="option"># new-videos</p>
        <p class="option"># updates</p>
        <p class="option"># faq</p>
        <button class="plus-button">+</button>
        
        
    </div>
</body>
</html>
