<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
        }

        .main{
            
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
        }

        @media (max-width: 500px){
            .main{
                grid-template-columns: 1fr;
            }
        }

        @media (min-width:501px) and (max-width: 1000px){
            .main{
                grid-template-columns: 1fr 1fr;
            }

        }

        @media (min-width: 1001px) and (max-width: 1500px){
            .main{
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        .bloco-1{
            background-color: lightcoral;      
            height: 300px;
            margin: 10px;
        }
        .bloco-2{
            background-color: lightblue;      
            height: 300px;
            margin: 10px;
        }
        .bloco-3{
            background-color: lightgray;      
            height: 300px;
            margin: 10px;
        }
        

    </style>
</head>
<body>
    <div class="main">
        <div class="bloco-1">Bloco 1</div>
        <div class="bloco-2">Bloco 2</div>
        <div class="bloco-3">Block 3</div>
        <div class="bloco-1">Bloco 4</div>
        <div class="bloco-2">Bloco 5</div>
        <div class="bloco-3">Block 6</div>
        <div class="bloco-1">Bloco 7</div>
        <div class="bloco-2">Bloco 8</div>
        <div class="bloco-3">Block 9</div>
    </div>
</body>
</html>
