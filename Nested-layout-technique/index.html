<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .profile{
            margin: 20px;
            padding: 10px;
            width: 600px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);

        }
        .profile-image{
            width: 100px;
            height: 100px;
            display: inline-block;
            vertical-align: middle;
        }
        .image{
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50px;
        }
        .info{
            margin-left: 20px;
            display: inline-block;
            vertical-align: middle;
        }
        p{
            font-family: arial;
            margin: 2px;
        }
        .name{
            
            font-size: 20px;
            font-weight: 700;
            
            
        }
        .nickname{
            font-size: 20px;
            color: grey;
        }
        .popularity{
            font-size: 20px;
            color: grey;
        }
        .button{
            margin-left: 250px;
            display: inline-block;
            vertical-align: middle;
        }
        .follow-button{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 25px;
            font-weight: 600;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background-color: rgb(60, 165, 230);
            color: white;
        }

    </style>
</head>
<body>
    <div class="profile">
        <div class = "profile-image">
            <img class="image" src="images/cat2-photo.jpg" alt="">
        </div>
        <div class="info">
            <p class="name">Oliver</p>
            <p class="nickname">the cat</p>
            <p class="popularity">Popular</p>
        </div>
        <div class="button">
            <button class="follow-button">Follow</button>
        </div>
    </div>
        <div class="profile">
        <div class = "profile-image">
            <img class="image" src="images/cat-photo.jpg" alt="">
        </div>
        <div class="info">
            <p class="name">Mimi</p>
            <p class="nickname">Sleepy cat</p>
            <p class="popularity">Popular</p>
        </div>
        <div class="button">
            <button class="follow-button">Follow</button>
        </div>
    </div>
        <div class="profile">
        <div class = "profile-image">
            <img class="image" src="images/dog-image.jpg" alt="">
        </div>
        <div class="info">
            <p class="name">Rex</p>
            <p class="nickname">Happy dog</p>
            <p class="popularity">Popular</p>
        </div>
        <div class="button">
            <button class="follow-button">Follow</button>
        </div>
    </div>

</body>
</html>
